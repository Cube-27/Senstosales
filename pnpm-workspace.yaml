packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: false

# miniflare (local D1 for the dialect check) imports sharp only for its Images binding; sharp's native libvips
# packages are LGPL, which C13 avoids. exceljs 4.4 pins unzipper 0.10, whose `binary` -> `buffers` chain declares no
# licence (C13 denies it); unzipper 0.12 drops that chain and keeps the `Parse` API exceljs uses for streaming reads.
# `vite` resolves to the Vite+ core so plugins that peer on vite (@vitejs/plugin-react, the TanStack router plugin)
# share the one Vite that `vp` runs instead of installing a second copy.
# The last three lift transitive pins past published advisories (`pnpm audit`): miniflare pins undici 7.28.0,
# exceljs pins uuid 8, drizzle-kit's @esbuild-kit loader pins esbuild 0.18.
overrides:
  miniflare>sharp: "-"
  vite: npm:@voidzero-dev/vite-plus-core@^1.2.0
  exceljs>unzipper: ^0.12.3
  undici@<7.29.1: ^7.29.1
  uuid@<11.1.1: ^11.1.1
  esbuild@<0.24.3: ^0.25.12

# Supply chain: trust signals (provenance, signatures) may not weaken between updates. No release-age quarantine
# (pnpm defaults to one day): the Vite+ toolchain ships new dependencies that a quarantine blocks (D-0001).
minimumReleaseAge: 0
trustPolicy: no-downgrade
# Releases older than a year (in minutes) predate provenance publishing and are not judged.
trustPolicyIgnoreAfter: 525600
