# Release (SPEC-20 PR 5, INV-93, INV-105). A `v<VERSION>` tag builds the per-user NSIS installer (unsigned in v1,
# A-25), signs it for the updater with the Tauri key (repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, H6), smoke-tests it, writes latest.json and publishes the three files as the
# GitHub release `v<VERSION>`. The app's updater reads the newest release's latest.json (tauri.conf.json).
# A pull request that changes the release files, or a manual run, is a dry run: the same build, signing and manifest,
# kept as a workflow artifact for 7 days. Only a tag publishes.
# To release: set VERSION, run `node tools/release/src/stamp-version.ts`, merge, then tag main:
#   git tag v<VERSION> origin/main && git push origin v<VERSION>
# Every action is pinned to a full commit SHA with its version in a comment, as in ci.yml.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/src/stamp-version.ts
      - tools/release/src/updater-manifest.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests from forks get no secrets, so they cannot sign.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      # Not the bundle folder: an installer from an earlier VERSION would come back beside the new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle
          key: desktop-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: node tools/release/src/stamp-version.ts --check
      - name: Tag matches VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match VERSION $version."
            exit 1
          fi
      - name: Build and sign the installer
        env:
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:desktop
      - run: node apps/desktop/test/smoke.ts
      - run: >-
          node tools/release/src/updater-manifest.ts apps/desktop/src-tauri/target/release/bundle/nsis
          "${{ github.server_url }}/${{ github.repository }}/releases/download"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --title "SenstoSales ${TAG#v}"
          --notes "Download the -setup.exe file and run it. Installed copies update themselves."
