# CI for the pnpm monorepo. Each job runs a root script, so `pnpm verify` (all of them, in order) is what CI runs.
# Every action is pinned to a full commit SHA with its version in a comment; refresh pins with Dependabot or
# `pinact`, never by switching to a tag.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The first job: tools/orchestrator/config.sh CI_FIRST_JOB names it, and it never skips. It decides which jobs a
  # pull request needs (tools/checks/src/changes.ts): one that touches only docs/**, *.md and .claude/skills/** skips
  # check, licenses, build, audit and e2e; anything else, and every push to main, runs everything. The gate is a
  # job-level `if:`, never workflow-level `paths:`, so a skipped job still reports and satisfies the required checks.
  # real-data-scan always runs. A docs-only change still gets check's format step (Oxfmt formats *.md): this job runs
  # `vp fmt --check` on its changed files, so a misformatted doc never reaches main.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # On a push BASE is empty: no paths, so everything runs; a failed diff runs everything too.
        run: |
          if [ -n "$BASE" ]; then git diff --name-only --diff-filter=d "$BASE...$HEAD" || true; fi > "$RUNNER_TEMP/changed.txt"
          node tools/checks/src/changes.ts < "$RUNNER_TEMP/changed.txt"
      - if: steps.paths.outputs.code == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.paths.outputs.code == 'false'
        run: xargs -d '\n' pnpm exec vp fmt --check --no-error-on-unmatched-pattern < "$RUNNER_TEMP/changed.txt"

  # Format, lint (C15 guardrails, C12/C3 boundaries), the INV-90 language check, the INV-64 status-source check, the
  # INV-84 migration SQL lint and D1 dialect step (every migration applied on a local in-memory D1), typecheck, tests
  # (including the orchestrator tools and `bash -n` over tools/orchestrator/*.sh).
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:code

  # Contract C1: no real data in this public repo. Needs no dependencies; runs on every change, docs included.
  real-data-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: node tools/checks/src/real-data-scan.ts

  # Contract C13: dependency licence deny-list, plus a CycloneDX SBOM uploaded as an artifact.
  licenses:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses
      - run: pnpm sbom --sbom-format cyclonedx > license-report/sbom.cdx.json
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: license-report
          path: license-report/

  # Every workspace package's build script.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:build

  # Known vulnerabilities in production dependencies at high or above, then INV-108: every action pinned to a full
  # commit SHA and read-only default permissions (the pin check parses YAML, so it needs the install).
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:audit

  # SPEC-14 §2: Playwright on Windows, headless on the runner's Edge. The API on a temp data folder serves the built
  # SPA (e2e/), and the shared components are measured on a page built from ct/ (no-layout-shift, C8). The
  # screenshots are review artefacts.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The e2e specs drive the built SPA (apps/web/dist); `pnpm verify` has built it in check:build already.
      - run: pnpm --filter @senstosales/web build
      - run: pnpm check:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: apps/web/test-results/

  # SPEC-20: the per-user NSIS installer and the desktop smoke test (ARCHITECTURE §14.1). Builds the SPA, the SEA
  # sidecar and the Tauri shell, then installs without admin rights, runs the app (health on 127.0.0.1, single
  # instance, closing the window ends the sidecar) and uninstalls, checking that the data stays. Rust comes with the
  # runner image.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: desktop-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senstosales/web --filter @senstosales/desktop build
      - run: node tools/release/src/build-sidecar.ts
      - run: pnpm --filter @senstosales/desktop exec tauri build
      - name: Smoke test the installer
        shell: bash
        run: node apps/desktop/test/smoke.ts --installer "$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
