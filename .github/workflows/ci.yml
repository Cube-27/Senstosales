# CI for the pnpm monorepo. `pnpm verify` runs the same steps locally in the same order.

# Every action is pinned to a full commit SHA with its version in a comment; refresh pins with Dependabot or

# `pinact`, never by switching to a tag.

name: ci

on:
  pull_request:

  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

  cancel-in-progress: true

jobs:
  # The first job: tools/orchestrator/config.sh CI_FIRST_JOB names it.

  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

        with:
          node-version: "24"

          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # Contract C1: no real data in this public repo (docs/ARCHITECTURE.md §14.3).

  real-data-scan:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

        with:
          node-version: "24"

      - run: node tools/checks/src/real-data-scan.ts

        env:
          REAL_DATA_DENYLIST: ${{ secrets.REAL_DATA_DENYLIST }}

  # Dependency licence deny-list and a CycloneDX SBOM (uploaded as an artifact).

  licenses:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

        with:
          node-version: "24"

          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Licence report and SBOM

        run: |

          mkdir -p license-report

          pnpm licenses list --json --recursive > license-report/licenses.json

          # pnpm >= 11; on older pnpm use `pnpm dlx @cyclonedx/cyclonedx-npm --output-file ...` instead.

          pnpm sbom --sbom-format cyclonedx > license-report/sbom.cdx.json

      - run: node tools/license_check.mjs license-report/licenses.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        if: ${{ !cancelled() }}

        with:
          name: license-report

          path: license-report/

  # Orchestrator tooling: merge_guard.py and the shell scripts.

  tools:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - run: uvx ruff check tools && uvx ruff format --check tools

      - run: uv run --with pytest pytest tools/tests

      - run: for f in tools/orchestrator/*.sh; do bash -n "$f"; done
