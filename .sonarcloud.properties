# SonarCloud automatic analysis. Parser fixture pages are test data that copy BHEL's legacy table markup on purpose
# (SPEC-06 §4.3); the HTML rules and duplication detection would push them away from the pages they model. Generated
# files are checked against their generator instead (C15).
sonar.exclusions=packages/parsers/fixtures/**,**/*.generated.ts

# Rules that misread this codebase, each scoped to where it misreads. Rules that find real issues stay on; their
# patterns are in docs/ENGINEERING.md "Patterns the analysers flag".
sonar.issue.ignore.multicriteria=sep,loop,role,zod,fake,gen,nsimport,json,colours,redostools,redostests,stubs,filler,cli,path

# Separators mark the fixed-point scale, not thousands: 100_00000 is 100 at 1e-5 (C3).
sonar.issue.ignore.multicriteria.sep.ruleKey=typescript:S7749
sonar.issue.ignore.multicriteria.sep.resourceKey=**/*
# Awaits in loops are sequential on purpose: ordered ids, a staging id chained from the last request, bounded memory
# and D1 load, polling.
sonar.issue.ignore.multicriteria.loop.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loop.resourceKey=**/*
# role="status"/"progressbar"/"group" on styled elements is the frozen legacy markup (C7); native elements restyle it.
sonar.issue.ignore.multicriteria.role.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.role.resourceKey=apps/web/**
# zod's .catch() is not a promise chain, and the entry point must not await before the first render.
sonar.issue.ignore.multicriteria.zod.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.zod.resourceKey=**/*
# The fake scraper implements a Promise-returning port: async keeps its throws as rejections, as the real adapter's.
sonar.issue.ignore.multicriteria.fake.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.fake.resourceKey=packages/scraper/src/fake.ts
# Async generators need async without await to be async iterables.
sonar.issue.ignore.multicriteria.gen.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.gen.resourceKey=packages/documents/test/stream/rows.ts
# A lazily loaded package's namespace type import cannot share a statement with named type imports (D-0335).
sonar.issue.ignore.multicriteria.nsimport.ruleKey=typescript:S3863
sonar.issue.ignore.multicriteria.nsimport.resourceKey=apps/api/src/services/**
# Golden helpers round-trip through JSON to drop undefined; structuredClone keeps it.
sonar.issue.ignore.multicriteria.json.ruleKey=typescript:S7784
sonar.issue.ignore.multicriteria.json.resourceKey=**/test/**
# The colour validator's patterns are Tailwind's word lists.
sonar.issue.ignore.multicriteria.colours.ruleKey=typescript:S5843
sonar.issue.ignore.multicriteria.colours.resourceKey=tools/checks/src/validate-colors.ts
# Repo tools and tests read files from this repo only; no untrusted input reaches their regexes.
sonar.issue.ignore.multicriteria.redostools.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.redostools.resourceKey=tools/**
sonar.issue.ignore.multicriteria.redostests.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.redostests.resourceKey=**/test/**
# Test doubles (ResizeObserver and the like) are empty on purpose.
sonar.issue.ignore.multicriteria.stubs.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.stubs.resourceKey=**/test/**
# DataTable's filler rows hold one empty cell; nothing in them can take focus (C8).
sonar.issue.ignore.multicriteria.filler.ruleKey=typescript:S6825
sonar.issue.ignore.multicriteria.filler.resourceKey=apps/web/src/components/common/DataTable.tsx
# Repo check scripts read the file the developer or CI names and run git from PATH, like every other dev tool.
sonar.issue.ignore.multicriteria.cli.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.cli.resourceKey=tools/**
sonar.issue.ignore.multicriteria.path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=tools/**
